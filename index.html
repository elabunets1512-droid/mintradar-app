<!DOCTYPE html>
<html lang="uk">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>MintRadar</title>
 <script src="https://telegram.org/js/telegram-web-app.js"></script>
 <style>
 body { font-family: -apple-system, sans-serif; background: #0b0e14; color: #fff; padding: 15px; padding-bottom: 80px; margin: 0; }
 .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: bold; }
 .badge { background: rgba(0,255,136,0.1); color: #00ff88; padding: 4px 10px; border-radius: 20px; font-size: 12px; border: 1px solid #00ff88; }
 .card { background: #1a1d26; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #2a2d35; }
 .price-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
 .price-item { background: #1a1d26; padding: 12px; border-radius: 12px; border: 1px solid #2a2d35; }
 .price-val { font-size: 20px; font-weight: bold; color: #00ff88; }
 .nft-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #2a2d35; }
 .nft-row:last-child { border-bottom: none; padding-bottom: 0; }
 .nft-name { font-weight: bold; font-size: 14px; }
 .nft-desc { font-size: 11px; color: #8b8e96; margin-top: 2px; }
 .nft-price { text-align: right; color: #00bfff; font-weight: bold; font-size: 15px; }
 .nft-usd { font-size: 11px; color: #8b8e96; font-weight: normal; margin-top: 2px; }
 .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; background: linear-gradient(90deg, #ff9900, #ff5500); color: #000; cursor: pointer; }
 .tab { display: none; } .tab.active { display: block; }
 .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1d26; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #2a2d35; }
 .nav-btn { font-size: 12px; color: #8b8e96; cursor: pointer; text-align: center; }
 .nav-btn.active { color: #00bfff; font-weight: bold; }
 </style>
</head>
<body>
 <div class="header"><div>🟢 MintRadar</div><div class="badge">GIFT RADAR</div></div>

 <!-- РАДАР -->
 <div id="tab-radar" class="tab active">
 <div class="price-box">
 <div class="price-item">
 <div style="font-size:11px; color:#8b8e96;">КУРС TON (USD)</div>
 <div class="price-val" id="ton-price">$0.00</div>
 </div>
 <div class="price-item">
 <div style="font-size:11px; color:#8b8e96;">ІНДЕКС ПОДАРУНКІВ</div>
 <div class="price-val" id="gift-index" style="color:#ff9900;">0</div>
 </div>
 </div>
 <div class="card" id="nft-list">
 <!-- Список NFT генерується скриптом -->
 </div>
 </div>

 <!-- РУЛЕТКА -->
 <div id="tab-spin" class="tab">
 <div class="card" style="text-align: center; padding: 40px 16px;">
 <h2 style="margin-top:0;">🎰 NFT Рулетка</h2>
 <div style="font-size: 80px; margin: 20px 0;">🎁</div>
 <button class="btn" onclick="payAndSpin()">Оплатити 15 ⭐ і крутити</button>
 <p style="color: #8b8e96; font-size: 12px; margin-top: 15px;">Пусто 70% • ⭐ 5 зірок 25% • 🎁 NFT 5%</p>
 </div>
 </div>

 <!-- ГАМАНЕЦЬ -->
 <div id="tab-wallet" class="tab">
 <div class="card">
 <h2 style="margin-top:0; font-size: 18px;">💼 Гаманець</h2>
 <p style="color: #8b8e96; font-size: 14px;">Trust Wallet, Tonkeeper, Telegram Wallet.</p>
 <button class="btn" onclick="alert('Тут буде підключення TON Connect')">Підключити</button>
 </div>
 </div>

 <!-- ПРОФІЛЬ -->
 <div id="tab-prof" class="tab">
 <div class="card" style="text-align: center;">
 <img id="avatar" src="https://via.placeholder.com/80" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid #00bfff; margin-bottom: 10px;">
 <h2 id="user-name" style="margin: 0;">Користувач</h2>
 <p id="user-id" style="color: #8b8e96; font-size: 14px; margin-top: 5px;">ID: 0</p>
 </div>
 </div>

 <!-- НАВІГАЦІЯ -->
 <div class="nav">
 <div class="nav-btn active" onclick="switchTab('radar', this)">📡<br>Радар</div>
 <div class="nav-btn" onclick="switchTab('spin', this)">🎰<br>Рулетка</div>
 <div class="nav-btn" onclick="switchTab('wallet', this)">💼<br>Гаманець</div>
 <div class="nav-btn" onclick="switchTab('prof', this)">👤<br>Профіль</div>
 </div>

 <script>
 const tg = window.Telegram.WebApp;
 tg.expand();

 // Список колекцій з датами виходу та орієнтовними цінами (в TON)
 const GIFT_COLLECTIONS = [
 { name: "Plush Pepe", date: "01.12.2024", price: 6900 },
 { name: "Durov's Cap", date: "01.12.2024", price: 680 },
 { name: "Loot Bag", date: "01.12.2024", price: 185 },
 { name: "Swiss Watch", date: "01.12.2024", price: 95 },
 { name: "Diamond Ring", date: "01.12.2024", price: 62 },
 { name: "Coconut Drink", date: "14.08.2025", price: 150 },
 { name: "Heart Pendant", date: "14.02.2025", price: 500 },
 { name: "Nail Bracelet", date: "14.02.2025", price: 5000 },
 { name: "Neko Helmet", date: "08.03.2025", price: 1200 },
 { name: "Party Sparkler", date: "23.12.2024", price: 400 },
 { name: "Pet Snake", date: "31.12.2024", price: 400 },
 { name: "Pink Flamingo", date: "14.08.2025", price: 250 },
 { name: "Precious Peach", date: "01.12.2024", price: 5000 },
 { name: "Record Player", date: "05.11.2024", price: 1000 },
 { name: "Restless Jar", date: "14.02.2025", price: 150 },
 { name: "Sakura Flower", date: "05.10.2024", price: 100 },
 { name: "Scared Cat", date: "29.10.2024", price: 20000 },
 { name: "Sharp Tongue", date: "29.10.2024", price: 10000 },
 { name: "Signet Ring", date: "01.12.2024", price: 30000 },
 { name: "Skull Flower", date: "29.10.2024", price: 30000 },
 { name: "Sky Stilettos", date: "14.02.2025", price: 70000 },
 { name: "Sleigh Bell", date: "17.12.2024", price: 50000 },
 { name: "Snake Box", date: "01.01.2025", price: 400 },
 { name: "Trojan Horse", date: "31.12.2025", price: 500 },
 { name: "Telegram Pin", date: "15.11.2025", price: 500 },
 { name: "Grave", date: "31.10.2025", price: 15000 },
 { name: "Coffin", date: "31.10.2025", price: 5000 },
 { name: "Mask", date: "31.10.2025", price: 500 },
 { name: "Durov's Statuette", date: "10.10.2025", price: 41000 },
 { name: "T-shirt", date: "10.10.2025", price: 10000 },
 { name: "Durov's Sneakers", date: "10.10.2025", price: 10000 },
 { name: "Case", date: "31.08.2025", price: 5000 },
 { name: "REDO", date: "14.08.2025", price: 5000 },
 { name: "Sand Castle", date: "14.08.2025", price: 500 },
 { name: "Cream Ice Cream", date: "31.05.2025", price: 150 },
 { name: "Red Star", date: "08.05.2025", price: 100 },
 { name: "Bird Mark", date: "08.05.2025", price: 150 },
 { name: "1 May", date: "30.04.2025", price: 100 },
 { name: "Easter Cake", date: "19.04.2025", price: 75 },
 { name: "Eight Roses", date: "07.03.2025", price: 200 },
 { name: "Roses", date: "08.03.2025", price: 150 },
 { name: "Mosque", date: "30.03.2025", price: 200 },
 { name: "Pen", date: "01.09.2025", price: 50 },
 { name: "Perfume Bottle", date: "24.11.2024", price: 10000 },
 { name: "Santa Hat", date: "17.12.2025", price: 150 },
 { name: "Poop", date: "01.04.2025", price: 300 },
 { name: "Resistance Dog", date: "14.08.2025", price: 20000 }
 ];

 function switchTab(id, el) {
 document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
 document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
 document.getElementById('tab-' + id).classList.add('active');
 el.classList.add('active');
 }

 // Отримання ціни TON та побудова списку
 async function loadData() {
 try {
 // Отримуємо курс TON
 const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd');
 const data = await res.json();
 const ton = data['the-open-network'].usd;
 document.getElementById('ton-price').innerText = '$' + ton.toFixed(2);

 // Генеруємо список NFT
 const container = document.getElementById('nft-list');
 container.innerHTML = '';
 
 // Сортуємо за ціною (від дорогих до дешевших)
 const sorted = [...GIFT_COLLECTIONS].sort((a, b) => b.price - a.price);

 sorted.forEach(item => {
 const usd = (item.price * ton).toLocaleString('en-US', {maximumFractionDigits: 0});
 const row = document.createElement('div');
 row.className = 'nft-row';
 row.innerHTML = `
 <div>
 <div class="nft-name">${item.name}</div>
 <div class="nft-desc">Випуск: ${item.date}</div>
 </div>
 <div class="nft-price">
 ${item.price.toLocaleString('en-US')} TON
 <div class="nft-usd">~$${usd}</div>
 </div>
 `;
 container.appendChild(row);
 });

 // Оновлюємо "Індекс подарунків" (просто сума всіх цін для прикладу)
 const totalIndex = sorted.reduce((sum, item) => sum + item.price, 0);
 document.getElementById('gift-index').innerText = totalIndex.toLocaleString('en-US');

 } catch (e) {
 console.error("Помилка завантаження даних", e);
 }
 }

 loadData();
 setInterval(loadData, 30000); // Оновлювати кожні 30 секунд

 // Дані користувача
 if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
 document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
 document.getElementById('user-id').innerText = 'ID: ' + tg.initDataUnsafe.user.id;
 if (tg.initDataUnsafe.user.photo_url) document.getElementById('avatar').src = tg.initDataUnsafe.user.photo_url;
 }

 function payAndSpin() {
 tg.sendData(JSON.stringify({ action: "spin_pay" }));
 }
 </script>
</body>
</html>
