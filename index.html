<script>
function go(t,e){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-i').forEach(x=>x.classList.remove('active'));
  document.getElementById('t-'+t).classList.add('active');
  e.classList.add('active');
}

setTimeout(()=>{
  try {
    const tg = window.Telegram.WebApp;
    tg.expand();
    if(tg.initDataUnsafe?.user){
      const u=tg.initDataUnsafe.user;
      document.getElementById('uname').innerText=u.first_name+(u.last_name?' '+u.last_name:'');
      document.getElementById('uid').innerText=(u.username?'@'+u.username+' • ':'')+'ID: '+u.id;
      if(u.photo_url)document.getElementById('uava').innerHTML='<img src="'+u.photo_url+'">';
    }
  } catch(err) {}
  try {
    new TONConnectUI.TonConnectUI({
      manifestUrl: 'https://'+'elabunets1512-droid.github.io/mintradar-app/tonconnect-manifest.json',
      buttonRootId: 'ton-connect-btn'
    });
  } catch(e) {}
}, 800);

function payAndSpin(){
  try {
    window.Telegram.WebApp.sendData(JSON.stringify({action: "spin_15"}));
  } catch(e) {
    alert("Відкрийте застосунок через кнопку '📱 Відкрити MintRadar App' у меню бота!");
  }
}

function showRate(price, label){
  document.getElementById('ton').innerText='$'+price.toFixed(3);
  document.getElementById('b-status').innerText=label;
  const now=new Date();
  document.getElementById('upd').innerText=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0');
  document.querySelectorAll('.usd').forEach(el=>{
    const t=parseFloat(el.getAttribute('data-ton'));
    el.innerText='~$'+Math.round(t*price).toLocaleString();
  });
}

async function fetchLiveTON(){
  const u1 = 'https://'+'://cryptocompare.com';
  const u2 = 'https://'+'api.coincap.io/v2/assets/toncoin';
  try {
    const r = await fetch(u1);
    const d = await r.json();
    if(d.USD){ showRate(parseFloat(d.USD), 'BINANCE LIVE'); return; }
  } catch(e) {}
  try {
    const r2 = await fetch(u2);
    const d2 = await r2.json();
    if(d2.data?.priceUsd){ showRate(parseFloat(d2.data.priceUsd), 'LIVE RATE'); }
  } catch(e) {}
}
fetchLiveTON();
setInterval(fetchLiveTON, 60000);
</script>
</body>
</html>
