<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MintRadar - Upgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0e14; --panel: #15181e; --card: #1c1f26; --text: #ffffff;
            --muted: #8b8e96; --border: #2a2d35; 
            --yellow: #ffcc00; --purple: #8a2be2; --red: #ff3333; --white: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; overflow-x: hidden;
        }

        /* Верхнє меню та Баланс (Чорний колір) */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border); }
        .logo { font-size: 20px; font-weight: 900; color: var(--yellow); text-transform: uppercase; letter-spacing: 1px;}
        .balance { font-size: 14px; font-weight: bold; color: var(--text); display: flex; align-items: center; gap: 5px; }

        /* Основна сітка */
        .main-layout { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 800px) { .main-layout { grid-template-columns: 300px 1fr 350px; } }

        .panel { background: var(--panel); border-radius: 16px; padding: 15px; border: 1px solid var(--border); }
        .panel-title { font-size: 14px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }

        /* 1. ЛІВА КОЛОНКА: Інвентар (Фіолетовий) */
        .inventory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px;}
        .inv-card { background: var(--card); border-radius: 10px; padding: 10px; text-align: center; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
        .inv-card:hover { border-color: var(--purple); background: rgba(138, 43, 226, 0.1); }
        .inv-card.selected { border-color: var(--purple); background: rgba(138, 43, 226, 0.2); box-shadow: 0 0 10px rgba(138,43,226,0.5); }
        .inv-img { width: 50px; height: 50px; object-fit: contain; }
        .inv-name { font-size: 11px; font-weight: bold; margin: 5px 0; height: 26px; overflow: hidden; }
        
        /* Ціна предмету (Червоний) */
        .inv-price { font-size: 12px; font-weight: bold; color: var(--red); background: rgba(255,51,51,0.1); padding: 2px 5px; border-radius: 5px; display: inline-block; }

        /* 2. ЦЕНТР: Колесо (Жовтий) */
        .center-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .upgrade-zone { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 20px; }
        
        /* Колесо */
        .wheel-container { position: relative; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; margin: 20px 0; }
        .wheel-bg { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: repeating-conic-gradient(from 0deg, #2a2d35 0deg 2deg, transparent 2deg 10deg); border: 2px solid #1a1d26; }
        
        /* ЗАЛИВКА КОЛЕСА (ЯК ВОДА) */
        .wheel-arc { 
            position: absolute; width: 100%; height: 100%; border-radius: 50%; 
            /* Лінійний градієнт від низу до верху */
            background: linear-gradient(to top, var(--yellow) var(--chance-percent, 0%), #2a2d35 var(--chance-percent, 0%)); 
            -webkit-mask: radial-gradient(transparent 60%, black 61%); 
            mask: radial-gradient(transparent 60%, black 61%); 
        }
        
        /* Стрілка */
        .wheel-arrow { position: absolute; top: 0; left: 50%; margin-left: -10px; width: 20px; height: 100px; transform-origin: 50% 100%; z-index: 10; }
        .wheel-arrow::after { content: ''; position: absolute; top: 0; left: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 20px solid var(--yellow); }
        .wheel-arrow::before { content: ''; position: absolute; top: 20px; left: 9px; width: 2px; height: 80px; background: var(--yellow); }
        
        /* Центр колеса */
        .wheel-center { position: absolute; width: 90px; height: 90px; background: var(--bg); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid var(--border); z-index: 5; }
        .chance-text { font-size: 24px; font-weight: 900; color: var(--yellow); }

        /* Кнопка ПРОКАЧАТИ */
        .btn-upgrade { width: 100%; max-width: 300px; padding: 18px; border-radius: 12px; border: none; font-size: 18px; font-weight: 900; text-transform: uppercase; background: var(--yellow); color: #000; cursor: pointer; transition: 0.2s; }
        .btn-upgrade:disabled { opacity: 0.5; background: #333; color: #888; cursor: not-allowed; }
        .btn-upgrade:active { transform: scale(0.98); }

        /* Множники (Рожевий) */
        .multipliers { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 15px; }
        .mult-btn { background: transparent; color: #ff69b4; border: 1px solid #ff69b4; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .mult-btn:hover, .mult-btn.active { background: #ff69b4; color: #000; }

        /* 3. ПРАВА КОЛОНКА: Каталог (Білий) */
        .catalog-panel { display: flex; flex-direction: column; }
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; max-height: 500px; overflow-y: auto; padding-right: 5px;}
        
        .catalog-card { background: var(--card); border-radius: 10px; padding: 10px; text-align: center; border: 2px solid transparent; cursor: pointer; transition: 0.2s; position: relative; }
        .catalog-card:hover { border-color: var(--white); }
        .catalog-card.selected { border-color: var(--white); background: rgba(255,255,255,0.1); box-shadow: 0 0 10px rgba(255,255,255,0.3); }
        
        /* Ціна цільового предмета (Білий) */
        .cat-price { font-size: 11px; font-weight: bold; color: var(--white); margin-top: 5px; }

        /* Результат */
        .result-text { margin-top: 15px; font-weight: bold; text-align: center; font-size: 16px; min-height: 24px; }
    </style>
</head>
<body>

    <!-- Верхня панель -->
    <div class="top-bar">
        <div class="logo">🔼 Upgrader</div>
        <div class="balance">Баланс: <span style="color:var(--yellow)">10 000</span> ⭐</div>
    </div>

    <div class="main-layout">
        
        <!-- ЛІВА ПАНЕЛЬ (Інвентар) -->
        <div class="panel">
            <div class="panel-title" style="color: var(--purple);">Ваші NFT (Натисніть для вибору)</div>
            <div class="inventory-grid" id="inventory-grid"></div>
        </div>

        <!-- ЦЕНТРАЛЬНА ПАНЕЛЬ (Колесо) -->
        <div class="panel center-panel">
            <div class="wheel-container">
                <div class="wheel-bg"></div>
                <div class="wheel-arc" id="spin-arc"></div>
                <div class="wheel-arrow" id="spin-arrow"></div>
                <div class="wheel-center">
                    <div class="chance-text" id="modal-chance-text">0%</div>
                </div>
            </div>

            <!-- Множники -->
            <div class="multipliers">
                <button class="mult-btn" onclick="setMultiplier(2, this)">x2</button>
                <button class="mult-btn" onclick="setMultiplier(4, this)">x4</button>
                <button class="mult-btn" onclick="setMultiplier(8, this)">x8</button>
                <button class="mult-btn" onclick="setMultiplier(100/35, this)">35%</button>
                <button class="mult-btn" onclick="setMultiplier(100/55, this)">55%</button>
                <button class="mult-btn" onclick="setMultiplier(100/75, this)">75%</button>
            </div>

            <button class="btn-upgrade" id="upgrade-btn" onclick="startUpgrade()" style="margin-top: 20px;">Прокачати</button>
            <div class="result-text" id="result-text"></div>
        </div>

        <!-- ПРАВА ПАНЕЛЬ (Каталог) -->
        <div class="panel catalog-panel">
            <div class="panel-title" style="color: var(--white);">Оберіть цільовий NFT</div>
            <div class="catalog-grid" id="catalog-grid"></div>
        </div>

    </div>

    <!-- Нижня панель -->
    <div style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--muted);">
        <div style="font-weight: bold; color: var(--yellow); margin-bottom: 5px;">🔼 UPGRADER</div>
        Працює на базі MintRadar
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const allGifts = [
            { id: 1, name: "Стильна сумка", price: 100, img: "https://nft.fragment.com/gift/swagbag-232323.webp" },
            { id: 2, name: "Свічка", price: 80, img: "https://nft.fragment.com/gift/bdaycandle-62063.webp" },
            { id: 3, name: "Локшина", price: 50, img: "https://nft.fragment.com/gift/instantramen-147692.webp" },
            { id: 4, name: "Фігурка Свободи", price: 150, img: "https://nft.fragment.com/gift/libertyfigure-34093.webp" },
            { id: 5, name: "Великоднє яйце", price: 120, img: "https://nft.fragment.com/gift/easteregg-124942.webp" },
            { id: 6, name: "Гриб-шпигун", price: 200, img: "https://nft.fragment.com/gift/spyagaric-72016.webp" },
            { id: 7, name: "Ведмедик", price: 180, img: "https://nft.fragment.com/gift/toybear-14456.webp" },
            { id: 8, name: "Капелюх відьми", price: 130, img: "https://nft.fragment.com/gift/witchhat-2555.webp" },
            { id: 9, name: "Домашній торт", price: 90, img: "https://nft.fragment.com/gift/homemadecake-102256.webp" },
            { id: 10, name: "Морозиво", price: 60, img: "https://nft.fragment.com/gift/icecream-248748.webp" },
            { id: 11, name: "Холодне полум'я", price: 250, img: "https://nft.fragment.com/gift/chillflame-250222.webp" },
            { id: 12, name: "Вайс-крім", price: 300, img: "https://nft.fragment.com/gift/vicecream-378511.webp" },
            { id: 13, name: "Снуп Догг", price: 500, img: "https://nft.fragment.com/gift/snoopdogg-1.webp" },
            { id: 14, name: "Лол Поп", price: 400, img: "https://nft.fragment.com/gift/lolpop-381198.webp" },
            { id: 15, name: "Міфічна маска", price: 600, img: "https://nft.fragment.com/gift/mythmask-205987.webp" },
            { id: 16, name: "Кубок інтелекту", price: 800, img: "https://nft.fragment.com/gift/intelligencecup-1.webp" },
            { id: 17, name: "Кубок алгоритму", price: 1000, img: "https://nft.fragment.com/gift/algorithmcup-1.webp" },
            { id: 18, name: "Вогняний факел", price: 1200, img: "https://nft.fragment.com/gift/torch-1.webp" },
            { id: 19, name: "Plush Pepe", price: 2000, img: "https://nft.fragment.com/gift/plushpepe-1.webp" },
            { id: 20, name: "Durov's Cap", price: 1500, img: "https://nft.fragment.com/gift/durovscap-1.webp" }
        ];

        let myInventory = [...allGifts]; 
        let selectedMyItem = null;
        let selectedTargetItem = null;

        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';
            myInventory.forEach(item => {
                const card = document.createElement('div');
                card.className = `inv-card ${selectedMyItem && selectedMyItem.id === item.id ? 'selected' : ''}`;
                card.innerHTML = `
                    <img src="${item.img}" class="inv-img" onerror="this.src='https://via.placeholder.com/50?text=NFT'">
                    <div class="inv-name">${item.name}</div>
                    <div class="inv-price">${item.price} ⭐</div>
                `;
                card.onclick = () => selectInventoryItem(item);
                grid.appendChild(card);
            });
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';
            const sortedGifts = [...allGifts].sort((a, b) => a.price - b.price);

            sortedGifts.forEach(item => {
                if (selectedMyItem && item.id === selectedMyItem.id) return;

                const card = document.createElement('div');
                card.className = `catalog-card ${selectedTargetItem && selectedTargetItem.id === item.id ? 'selected' : ''}`;
                card.innerHTML = `
                    <img src="${item.img}" class="inv-img" onerror="this.src='https://via.placeholder.com/50?text=NFT'">
                    <div class="inv-name">${item.name}</div>
                    <div class="cat-price">${item.price} ⭐</div>
                `;
                card.onclick = () => selectTargetItem(item);
                grid.appendChild(card);
            });
        }

        function selectInventoryItem(item) {
            selectedMyItem = item;
            selectedTargetItem = null;
            updateUI();
        }

        function selectTargetItem(item) {
            if (!selectedMyItem) {
                alert("Спочатку виберіть предмет зліва, який будете прокачувати!");
                return;
            }
            if (item.price < selectedMyItem.price) {
                alert("Цільовий предмет має бути дорожчим або рівним за ціною!");
                return;
            }
            selectedTargetItem = item;
            updateUI();
        }

        function setMultiplier(mult, btnElement) {
            if (!selectedMyItem) {
                alert("Спочатку виберіть свій предмет!");
                return;
            }

            document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            const targetPrice = Math.round(selectedMyItem.price * mult);

            let closestItem = allGifts[0];
            let minDiff = Infinity;

            allGifts.forEach(item => {
                if (item.id === selectedMyItem.id) return;
                const diff = Math.abs(item.price - targetPrice);
                if (diff < minDiff) {
                    minDiff = diff;
                    closestItem = item;
                }
            });

            if (closestItem.price < selectedMyItem.price) {
                 closestItem = allGifts.find(i => i.price >= selectedMyItem.price) || allGifts[allGifts.length-1];
            }

            selectedTargetItem = closestItem;
            updateUI();
        }

        function updateUI() {
            renderInventory();
            renderCatalog();

            const chanceText = document.getElementById('modal-chance-text');
            const arc = document.getElementById('spin-arc');
            const arrow = document.getElementById('spin-arrow');
            const upgradeBtn = document.getElementById('upgrade-btn');
            const resultText = document.getElementById('result-text');

            arrow.style.transition = 'none';
            arrow.style.transform = 'rotate(0deg)';
            resultText.innerText = '';

            if (selectedMyItem && selectedTargetItem) {
                let chance = (selectedMyItem.price / selectedTargetItem.price) * 100;
                if (chance >= 100) chance = 99;
                if (chance < 1) chance = 1;

                chanceText.innerText = Math.round(chance) + '%';
                
                // ВОДА: передаємо відсоток заповнення (від 0% до 100%)
                arc.style.setProperty('--chance-percent', chance + '%');

                upgradeBtn.disabled = false;
            } else {
                chanceText.innerText = '0%';
                arc.style.setProperty('--chance-percent', '0%');
                upgradeBtn.disabled = true;
            }
        }

        function startUpgrade() {
            if (!selectedMyItem || !selectedTargetItem) return;

            const btn = document.getElementById('upgrade-btn');
            const resultText = document.getElementById('result-text');
            const arrow = document.getElementById('spin-arrow');
            
            btn.disabled = true;
            resultText.innerText = 'Крутимо...';
            resultText.style.color = 'var(--text)';

            let chance = (selectedMyItem.price / selectedTargetItem.price) * 100;
            if (chance >= 100) chance = 99;

            // Рахуємо половину кута. Наприклад, для 50% це 90 градусів (від низу вліво і вправо)
            const halfWidth = chance * 1.8; 
            const roll = Math.random() * 100;
            const isWin = roll <= chance;

            let targetAngle = 0;

            if (isWin) {
                // Виграшна зона йде симетрично від низу (180 градусів) вліво і вправо
                targetAngle = (180 - halfWidth) + (Math.random() * (halfWidth * 2));
            } else {
                // Програшна зона - це все інше коло (верхня частина)
                targetAngle = (180 + halfWidth) + (Math.random() * (360 - (halfWidth * 2)));
            }

            // Додаємо 5 повних обертів для ефекту
            const totalRotation = (360 * 5) + targetAngle;

            arrow.style.transition = 'transform 3s cubic-bezier(0.1, 0.8, 0.2, 1)';
            arrow.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                if (isWin) {
                    resultText.innerText = `🎉 ВІТАЮ! Ви отримали ${selectedTargetItem.name}`;
                    resultText.style.color = 'var(--yellow)';
                    
                    const index = myInventory.findIndex(i => i.id === selectedMyItem.id);
                    if (index !== -1) {
                        myInventory[index] = { ...selectedTargetItem };
                    }
                    
                    selectedMyItem = null;
                    selectedTargetItem = null;
                    updateUI();

                } else {
                    resultText.innerText = '😢 Поразка. Предмет згорів.';
                    resultText.style.color = 'var(--red)';
                    
                    myInventory = myInventory.filter(i => i.id !== selectedMyItem.id);
                    
                    selectedMyItem = null;
                    selectedTargetItem = null;
                    updateUI();
                }
                btn.disabled = false;
            }, 3000);
        }

        renderInventory();
        renderCatalog();

    </script>
</body>
</html>
